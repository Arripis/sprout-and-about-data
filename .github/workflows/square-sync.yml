# Square catalog/inventory -> storefront data. Stripe checkout is intentionally unchanged.
# Install this workflow and square-sync.mjs in the shop's DATA repository.
name: square-sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

concurrency:
  group: square-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: data

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Sync catalog and stock from Square
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          DATA_DIR: data/listings
          SQUARE_SELLER_NAME: ${{ vars.SQUARE_SELLER_NAME || 'Square' }}
          SQUARE_REQUIRE_IMAGE: ${{ vars.SQUARE_REQUIRE_IMAGE || 'false' }}
          SQUARE_REQUIRE_TRACKED_INVENTORY: ${{ vars.SQUARE_REQUIRE_TRACKED_INVENTORY || 'false' }}
          SQUARE_HIDE_UNMANAGED: ${{ vars.SQUARE_HIDE_UNMANAGED || 'false' }}
        run: node .github/scripts/square-sync.mjs

      - name: Classify ambiguous products
        env:
          DATA_DIR: data/listings
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-5.4-nano' }}
          SQUARE_CATEGORY_ALLOWLIST: ${{ vars.SQUARE_CATEGORY_ALLOWLIST || '[]' }}
        run: |
          if python .github/scripts/openrouter-categorize.py --check; then
            python -m pip install --disable-pip-version-check -r .github/scripts/requirements-openrouter.txt
            python .github/scripts/openrouter-categorize.py
          else
            echo "No OpenRouter category work needed."
          fi

      - name: Commit changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "no changes"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "square-sync[bot]"
          git config user.email "square-sync@users.noreply.github.com"
          git add data/listings
          git commit -m "chore(square): sync catalog and stock [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:data; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "push rejected (attempt $attempt); rebasing on latest data"
            git fetch origin data
            git rebase origin/data || { git rebase --abort; exit 1; }
          done
          echo "could not push after retries"; exit 1

      - name: Notify search engines with IndexNow
        if: steps.commit.outputs.changed == 'true'
        env:
          INDEXNOW_HOST: ${{ vars.INDEXNOW_HOST }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: node .github/scripts/indexnow-submit.mjs HEAD^
