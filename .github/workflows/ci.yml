name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [data]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/scripts/requirements-openrouter.txt
      - name: Install Python dependencies
        run: python -m pip install -r .github/scripts/requirements-openrouter.txt
      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in .github/scripts/*.mjs; do
            node --check "$file"
          done
      - name: Check Python syntax
        run: python -m compileall -q .github/scripts
